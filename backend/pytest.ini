[pytest]
# Puts backend/ (this file's directory) on sys.path, so test modules
# can do `from app.config import settings` etc. without needing
# tests/ to be an installed package or backend/ to already be the cwd
# by coincidence — `pytest` works the same whether run from backend/
# or anywhere else that can find this file.
pythonpath = .
testpaths = tests
